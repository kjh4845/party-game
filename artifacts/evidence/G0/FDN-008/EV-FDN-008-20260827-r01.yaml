  limitations:
    - "PlayMode는 temporary root와 새 repository object/frame boundary를 검증했을 뿐 Application.persistentDataPath binding, domain reload, 실제 Unity/client process restart를 검증하지 않았다. 해당 binding은 첫 product repository composition task가 소유한다."
    - "동시성 보장은 동일 game process 안의 repository instance에 한정된다. cross-process writer와 같은 사용자로 두 Player를 동시에 실행하는 경우는 검증하지 않았다."
    - "실제 filesystem 검증 환경은 macOS Editor다. Windows x64 File.Move/File.Replace/FileStream.Flush(true) 동작은 후속 Windows QA가 필요하다."
    - "Flush(true)와 same-directory atomic replace는 process crash·전원 손실·directory fsync의 절대 durability를 증명하지 않는다. fault seam은 commit 전 예외에서 이전 파일 보존만 검증한다."
    - "final root/collection/target reparse entry는 거부하지만 ancestor symlink, hard link와 check/open 사이 TOCTOU를 방어하거나 실행 시험하지 않았다. storage root와 local filesystem은 trusted composition 범위다."
    - "public constructor의 OS 예외는 local path를 포함할 수 있으므로 향후 composition이 catch/map해야 하며 UI나 network payload로 직접 노출하면 안 된다."
    - "SHA-256은 accidental corruption detection 전용이며 encryption, authenticity 또는 hostile local tamper protection이 아니다."
    - "Preset/Settings DTO·schema·migration·최대10·list/rename/delete·recovery UI와 persistentDataPath binding은 후속 task이며 FDN-008에서 구현하거나 검증하지 않았다."
    - "Unity 임시 log/XML은 local path·PID·licensing 식별자를 포함하므로 수치 요약 후 삭제했다. Player Build는 실행하지 않았다."
