<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#1d2229"/>
    </linearGradient>
    <linearGradient id="bodyLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#e9e9e4"/>
      <stop offset="1" stop-color="#b9bdbb"/>
    </linearGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e8e5"/>
      <stop offset="1" stop-color="#9fa5a4"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.44"/>
    </filter>
    <style>
      .ui { font-family: Inter, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 760; fill: #f4f1e9; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #aeb5bd; }
      .panel { fill: #20252c; stroke: #343b45; stroke-width: 2; }
      .panelTitle { font-size: 29px; font-weight: 760; fill: #f5f2ea; }
      .panelSub { font-size: 17px; font-weight: 580; fill: #c4cad0; }
      .metric { font-size: 18px; font-weight: 630; fill: #e0e2e3; }
      .metricDim { font-size: 16px; font-weight: 500; fill: #9ea6af; }
      .tiny { font-size: 14px; font-weight: 560; fill: #8e97a0; }
      .badgeText { font-size: 15px; font-weight: 740; fill: #17191d; }
      .grid { stroke: #65707b; stroke-width: 1; stroke-dasharray: 5 8; opacity: 0.24; }
      .heightGuide { stroke: #d79a43; stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.78; }
      .centerGuide { stroke: #65707b; stroke-width: 1; stroke-dasharray: 3 9; opacity: 0.18; }
      .outline { stroke: #89908f; stroke-width: 3; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="2400" height="1400" fill="url(#bg)"/>
  <g class="ui">
    <text x="64" y="66" class="title">MASTER CHARACTER · C1a 실루엣 재비교</text>
    <text x="64" y="101" class="subtitle">팔·다리가 전부 보이는 동일 A-pose · 별도 손 Mesh 없음 · 공식 레퍼런스의 큰 인상만 참고한 비율 후보</text>
    <rect x="2026" y="42" width="306" height="44" rx="22" fill="#e2a246"/>
    <text x="2179" y="71" text-anchor="middle" class="badgeText">v0.4 실패안 폐기 · v0.5 재설계</text>

    <rect x="48" y="128" width="736" height="1202" rx="24" class="panel"/>
    <rect x="832" y="128" width="736" height="1202" rx="24" class="panel"/>
    <rect x="1616" y="128" width="736" height="1202" rx="24" class="panel"/>

    <!-- Common comparison grid: crown y=220, ground y=1035, identical total height. -->
    <g>
      <line x1="72" y1="220" x2="760" y2="220" class="heightGuide"/>
      <line x1="72" y1="424" x2="760" y2="424" class="grid"/>
      <line x1="72" y1="628" x2="760" y2="628" class="grid"/>
      <line x1="72" y1="831" x2="760" y2="831" class="grid"/>
      <line x1="72" y1="1035" x2="760" y2="1035" class="heightGuide"/>
      <line x1="420" y1="208" x2="420" y2="1042" class="centerGuide"/>

      <line x1="856" y1="220" x2="1544" y2="220" class="heightGuide"/>
      <line x1="856" y1="424" x2="1544" y2="424" class="grid"/>
      <line x1="856" y1="628" x2="1544" y2="628" class="grid"/>
      <line x1="856" y1="831" x2="1544" y2="831" class="grid"/>
      <line x1="856" y1="1035" x2="1544" y2="1035" class="heightGuide"/>
      <line x1="1200" y1="208" x2="1200" y2="1042" class="centerGuide"/>

      <line x1="1640" y1="220" x2="2328" y2="220" class="heightGuide"/>
      <line x1="1640" y1="424" x2="2328" y2="424" class="grid"/>
      <line x1="1640" y1="628" x2="2328" y2="628" class="grid"/>
      <line x1="1640" y1="831" x2="2328" y2="831" class="grid"/>
      <line x1="1640" y1="1035" x2="2328" y2="1035" class="heightGuide"/>
      <line x1="1980" y1="208" x2="1980" y2="1042" class="centerGuide"/>
    </g>

    <!-- A: reference-adjacent direction. Limbs are drawn outside/over torso so the silhouette stays readable. -->
    <g>
      <text x="78" y="174" class="panelTitle">A · 기준형 / REFERENCE-ADJACENT</text>
      <text x="78" y="202" class="panelSub" fill="#e2a246">참고작의 ‘단순 몸통 + 긴 원통 팔다리’ 인상에 가장 가까운 출발안</text>
      <ellipse cx="420" cy="1037" rx="158" ry="24" fill="#080a0d" opacity="0.46"/>

      <g filter="url(#shadow)">
        <!-- Continuous rounded legs; there is no separate shoe/foot mesh in this front concept. -->
        <path d="M370 658 Q366 760 364 850 Q356 938 352 1004" fill="none" stroke="url(#bodyShade)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M470 658 Q474 760 476 850 Q484 938 488 1004" fill="none" stroke="url(#bodyLight)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Torso is drawn before arms. Arms sit on top at the shoulder and angle away from the torso. -->
        <path d="M315 402 Q420 374 525 402 C514 482 500 574 500 672 Q420 704 340 672 C340 574 326 482 315 402Z" fill="url(#bodyLight)" class="outline"/>
        <path d="M391 374 Q420 391 449 374 L454 409 Q420 430 386 409Z" fill="url(#bodyShade)"/>
        <ellipse cx="420" cy="298" rx="62" ry="78" fill="url(#bodyLight)" class="outline"/>

        <!-- Arm terminal itself is the visual hand area: rounded cap only, no sphere/palm/fingers. -->
        <path d="M320 406 Q295 468 282 540" fill="none" stroke="url(#bodyShade)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M282 540 Q270 631 260 718" fill="none" stroke="url(#bodyShade)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M520 406 Q545 468 558 540" fill="none" stroke="url(#bodyLight)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M558 540 Q570 631 580 718" fill="none" stroke="url(#bodyLight)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <rect x="78" y="1074" width="240" height="31" rx="15.5" fill="#e2a246"/>
      <text x="198" y="1095" text-anchor="middle" class="badgeText">우선 검토안 · 복제 수치 아님</text>
      <text x="78" y="1144" class="metric">머리 0.19H · 몸통 0.34H · 다리 0.43H</text>
      <text x="78" y="1174" class="metric">팔 0.41H · 어깨 0.25H · 보통 굵기</text>
      <text x="78" y="1215" class="metricDim">인상: 길지만 과도하지 않은 사람형 Paint canvas</text>
      <text x="78" y="1244" class="metricDim">팔 끝: 연속된 둥근 cap + 내부 Hand/Grip Anchor</text>
      <text x="78" y="1284" class="panelSub">확인: 이 정도의 몸통 길이와 팔다리 비율이 원하는 기준인가?</text>
    </g>

    <!-- B: deliberately longer/thinner alternative. -->
    <g>
      <text x="862" y="174" class="panelTitle">B · 장신형 / LONG REACH</text>
      <text x="862" y="202" class="panelSub">작은 머리·짧고 좁은 몸통·더 길고 가는 팔과 다리</text>
      <ellipse cx="1200" cy="1037" rx="154" ry="22" fill="#080a0d" opacity="0.46"/>

      <g filter="url(#shadow)">
        <path d="M1160 632 Q1155 744 1148 842 Q1140 932 1135 1011" fill="none" stroke="url(#bodyShade)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1240 632 Q1245 744 1252 842 Q1260 932 1265 1011" fill="none" stroke="url(#bodyLight)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M1110 377 Q1200 353 1290 377 C1280 454 1273 543 1268 642 Q1200 668 1132 642 C1127 543 1120 454 1110 377Z" fill="url(#bodyLight)" class="outline"/>
        <path d="M1178 344 Q1200 360 1222 344 L1227 379 Q1200 395 1173 379Z" fill="url(#bodyShade)"/>
        <ellipse cx="1200" cy="278" rx="51" ry="66" fill="url(#bodyLight)" class="outline"/>

        <path d="M1110 380 Q1078 451 1060 535" fill="none" stroke="url(#bodyShade)" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1060 535 Q1040 650 1020 750" fill="none" stroke="url(#bodyShade)" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1290 380 Q1322 451 1340 535" fill="none" stroke="url(#bodyLight)" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1340 535 Q1360 650 1380 750" fill="none" stroke="url(#bodyLight)" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <rect x="862" y="1074" width="190" height="31" rx="15.5" fill="#75cbd0"/>
      <text x="957" y="1095" text-anchor="middle" class="badgeText">차이를 크게 본 장신안</text>
      <text x="862" y="1144" class="metric">머리 0.16H · 몸통 0.31H · 다리 0.49H</text>
      <text x="862" y="1174" class="metric">팔 0.47H · 어깨 0.22H · 가는 굵기</text>
      <text x="862" y="1215" class="metricDim">인상: 긴 Reach와 흔들리는 Pose가 가장 강함</text>
      <text x="862" y="1244" class="metricDim">위험: Paint 면적 부족·멀리서 지나치게 가늘 수 있음</text>
      <text x="862" y="1284" class="panelSub">확인: A보다 더 길고 느슨한 방향까지 원하는가?</text>
    </g>

    <!-- C: deliberately broad/compact alternative. -->
    <g>
      <text x="1646" y="174" class="panelTitle">C · 중량형 / HEAVY CANVAS</text>
      <text x="1646" y="202" class="panelSub">큰 머리·넓고 긴 몸통·짧고 굵은 팔과 다리</text>
      <ellipse cx="1980" cy="1037" rx="176" ry="28" fill="#080a0d" opacity="0.46"/>

      <g filter="url(#shadow)">
        <path d="M1910 700 Q1905 792 1898 865 Q1888 939 1882 995" fill="none" stroke="url(#bodyShade)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2050 700 Q2055 792 2062 865 Q2072 939 2078 995" fill="none" stroke="url(#bodyLight)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M1836 416 Q1980 377 2124 416 C2112 505 2096 620 2100 715 Q1980 757 1860 715 C1864 620 1848 505 1836 416Z" fill="url(#bodyLight)" class="outline"/>
        <path d="M1945 394 Q1980 416 2015 394 L2020 430 Q1980 454 1940 430Z" fill="url(#bodyShade)"/>
        <ellipse cx="1980" cy="306" rx="86" ry="90" fill="url(#bodyLight)" class="outline"/>

        <path d="M1838 420 Q1812 477 1800 545" fill="none" stroke="url(#bodyShade)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1800 545 Q1792 620 1785 684" fill="none" stroke="url(#bodyShade)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2122 420 Q2148 477 2160 545" fill="none" stroke="url(#bodyLight)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2160 545 Q2168 620 2175 684" fill="none" stroke="url(#bodyLight)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <rect x="1646" y="1074" width="204" height="31" rx="15.5" fill="#e58c72"/>
      <text x="1748" y="1095" text-anchor="middle" class="badgeText">차이를 크게 본 중량안</text>
      <text x="1646" y="1144" class="metric">머리 0.22H · 몸통 0.37H · 다리 0.39H</text>
      <text x="1646" y="1174" class="metric">팔 0.34H · 어깨 0.35H · 굵은 굵기</text>
      <text x="1646" y="1215" class="metricDim">인상: Paint 면적·근접전 존재감·접지감이 가장 큼</text>
      <text x="1646" y="1244" class="metricDim">위험: 참고 방향보다 둔하고 마스코트처럼 보일 수 있음</text>
      <text x="1646" y="1284" class="panelSub">확인: 폭과 몸통 면적을 이 정도까지 키울 필요가 있는가?</text>
    </g>

    <text x="64" y="1370" class="metricDim">C1a v0.5 · Primary silhouette board · 기술 Collider/Anchor overlay는 캐릭터를 가리지 않는 별도 검증 자료로 분리</text>
    <text x="2336" y="1370" text-anchor="end" class="tiny">2026-08-12 · nominal H only · reference, not replica</text>
  </g>
</svg>
