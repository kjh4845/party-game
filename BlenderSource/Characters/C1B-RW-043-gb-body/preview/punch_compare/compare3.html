<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Punch Style Compare</title>
<style>
:root{--bg:#151a21;--fg:#e6e6e6;--accent:#ffcf70;--panel:#1f2630}
body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,system-ui,sans-serif}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid #2b3440}
button{background:var(--panel);color:var(--fg);border:1px solid #3a4452;border-radius:6px;padding:5px 9px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
input[type=range]{flex:1;min-width:200px}
h2{margin:14px 16px 6px;font-size:16px;color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 16px}
@media (max-width:900px){.row{grid-template-columns:repeat(2,1fr)}}
figure{margin:0;background:var(--panel);border-radius:8px;overflow:hidden}
figure img{width:100%;display:block} figcaption{padding:4px 8px;font-size:12px;color:#aab}
#ev{color:var(--accent);min-width:90px}
</style></head><body>
<header><button id="play">⏸ 일시정지</button>
<span>속도</span><span id="speeds"></span>
<button id="prev">◀</button><button id="next">▶</button>
<input id="slider" type="range" min="0" max="89" value="0"><span id="tick"></span><span id="ev"></span>
<span id="jumps"></span></header>

const jp=document.getElementById('jumps');
EV.forEach(([a,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{i=Math.max(0,Math.floor((a-4)/STEP));show();};jp.appendChild(b);});

slider.oninput=()=>{i=+slider.value;show();};
function loop(now){const dt=(now-last)/1000;last=now;if(playing){acc+=dt*60*speed/STEP;while(acc>=1){acc-=1;i=(i+1)%N;}show();}requestAnimationFrame(loop);}
