<style>
:root{--bg:#151a21;--fg:#e6e6e6;--accent:#ffcf70;--panel:#1f2630}
body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,system-ui,sans-serif}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #2b3440}

main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}

.sum{color:#aab;margin-bottom:6px;font-size:13px;min-height:2.6em}
img{width:100%;border-radius:8px;display:block}
.bar{position:relative;height:14px;background:var(--panel);border-radius:4px;margin-top:6px;cursor:pointer}
.pos{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.hit{position:absolute;top:2px;bottom:2px;width:4px;background:var(--accent);border-radius:2px}
</style></head><body>
