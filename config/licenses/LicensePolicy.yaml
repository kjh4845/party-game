LicensePolicy:
  schemaVersion: 1
  profileId: "project-hotfix-license-policy-r04"
  status: "APPROVED"
  approvedAtUtc: "2026-08-30T06:34:55Z"
  approvalBasis: "User approved the review-only image disposition, deletion of three source-unproven review files, removal of Unity tutorial/readme files, and the license policy on 2026-08-28 KST. The approved policy permits project-authored production assets when first-party ownership and immutable file evidence are recorded separately from review-only references. On 2026-08-29 KST the user confirmed kjh4845 as the first-party sourceOwner; r03 added a reusable non-shipping PRODUCTION_EVIDENCE seam. On 2026-08-30 KST the user rejected the prior C1B-005 geometry and required its FBX to remain immutable history but lose Player eligibility; r04 adds fail-closed SUPERSEDED_CONTENT without deleting or rewriting the historical file. Deferring the final Player-content audit follows the separately fixed no-automatic-build rule and BLD-001/ALP-001 ownership."

  scope:
    packageManifest: "Project hotfix/Packages/manifest.json"
    packageLock: "Project hotfix/Packages/packages-lock.json"
    packageInventory: "config/licenses/ThirdPartyInventory.yaml"
    distributedNoticeIndex: "THIRD_PARTY_NOTICES.md"
    directPackageCount: 46
    lockedPackageCount: 58
    packageChangesPerformedByLic001: 0
    reviewOnlyC2paImageCount: 18

  sourceOfTruth:
    - "Resolved package id, version, source and dependency depth come from Project hotfix/Packages/packages-lock.json."
    - "Direct-versus-transitive classification is the intersection of manifest.json and packages-lock.json."
    - "Package license families and notice components come from the resolved package LICENSE/NOTICE files, recorded by logical package-relative locator rather than a machine-specific PackageCache path."
    - "Unity built-in modules have no per-package notice in Unity 6000.3.9f1; their current basis is the Unity Editor Software Terms plus the installed editor's aggregate legal notice."
    - "An embedded C2PA claim is provenance evidence only and is not a copyright license or redistribution grant."
    - "A production asset is first-party only when its repository-relative path, immutable SHA-256, asset type, named source owner, PROJECT_AUTHORED status, intended use, rights disposition, and source evidence are recorded in the dedicated first-party inventory."
    - "A project-authored QA render derived from an inventoried production source is PRODUCTION_EVIDENCE, remains outside Player content, and must identify its exact GenerationManifest render output."

  evaluationOrder:
    - "BLOCKED license or missing rights evidence wins over every allow rule."
    - "Review-only content may remain in the repository only while shippingAllowed is false."
    - "First-party production content may be retained only while project authorship, first-party rights, non-review status, intended-use profile, and matching file evidence are all explicit."
    - "Official Unity packages and their bundled dependencies may be used under the applicable Unity terms when bundled NOTICE material is preserved."
    - "A final Windows Player audit may narrow the source inventory to files actually distributed, but may not silently remove a required notice."

  officialUnityPackageRule:
    decision: "ALLOW_WITH_CONDITIONS"
    conditions:
      - "The package must resolve from the approved Unity registry or the locked Unity editor built-in source."
      - "The exact resolved version and source must be present in ThirdPartyInventory.yaml."
      - "Bundled LICENSE and Third Party Notice material must remain discoverable through the recorded source locator."
      - "Any package NOTICE selected by the final Windows Player audit must be preserved in the release notice bundle or an equivalent user-visible notice surface."
      - "A package update invalidates the previous license review and requires a new inventory revision."

  generallyAllowedWithObligations:
    - family: "MIT"
      obligations: "Retain the applicable copyright and permission notice when redistribution requires it."
    - family: "0BSD/BSD-2-Clause/BSD-3-Clause/NCSA"
      obligations: "Retain the applicable notice and attribution conditions."
    - family: "Apache-2.0 and Apache-2.0 with LLVM exceptions"
      obligations: "Retain license and applicable NOTICE/attribution material."
    - family: "Zlib"
      obligations: "Retain source notices and do not misrepresent origin or altered source."
    - family: "Boost-1.0"
      obligations: "Retain the license where the bundled text requires it."
    - family: "Public Domain"
      obligations: "Keep the package's provenance record and bundled notice."
    - family: "Microsoft Public License, CC-BY, or a non-ambiguous bundled bespoke notice"
      obligations: "Allowed only as an official Unity package-bundled dependency with its complete bundled notice preserved; this is not a blanket approval for newly sourced content."

  blockedFamilies:
    - "GPL of any version or later-version form"
    - "AGPL of any version or later-version form"
    - "SSPL of any version"
    - "Non-commercial or NC restrictions"
    - "No-derivatives or ND restrictions"
    - "Unknown license for content proposed for shipping"
    - "Custom or bespoke terms whose commercial-use or redistribution grant is ambiguous"
    - "No license or rights evidence for newly sourced external content"

  newExternalAssetRule:
    decision: "FAIL_CLOSED"
    requiredEvidence:
      - "Stable source or author locator"
      - "Version, acquisition date, or immutable content hash"
      - "Commercial-use grant"
      - "Redistribution or embedding grant appropriate to the intended shipping form"
      - "Attribution and NOTICE requirements"
    failureDisposition: "shippingAllowed must remain false until every required evidence field is reviewed."

  firstPartyProductionAssetRule:
    decision: "ALLOW_WITH_EXPLICIT_FIRST_PARTY_EVIDENCE"
    requiredFields:
      - "path"
      - "sha256"
      - "assetType"
      - "sourceOwner"
      - "sourceStatus"
      - "intendedUse"
      - "licenseFamily"
      - "rightsStatus"
      - "noticeDisposition"
      - "reviewOnly"
      - "shippingAllowed"
      - "sourceEvidence"
    requiredValues:
      sourceStatus: "PROJECT_AUTHORED"
      licenseFamily: "PROJECT_AUTHORED"
      rightsStatus: "FIRST_PARTY"
      noticeDisposition: "NO_THIRD_PARTY_NOTICE"
      reviewOnly: false
    intendedUseProfiles:
      PRODUCTION_SOURCE:
        shippingAllowed: false
        meaning: "Canonical editable source retained for production but not copied into the Player build. A canonical .blend must use this profile and remain outside Project hotfix/Assets/ so Unity receives only the approved derived interchange asset."
      PRODUCTION_EVIDENCE:
        shippingAllowed: false
        meaning: "Project-authored QA output derived from an inventoried production source and retained only to evaluate or reproduce that source; it is neither canonical editable source nor Player content."
      SUPERSEDED_CONTENT:
        shippingAllowed: false
        meaning: "A previously eligible first-party Player/import artifact rejected or replaced by an explicit user decision; retained only as immutable history and blocked from Player activation, import use, and future derivation."
      PLAYER_CONTENT:
        shippingAllowed: true
        meaning: "Derived or runtime-ready content whose first-party rights permit inclusion in the Player build, subject to the final build audit."
    shippingAllowedSemantics: "This field records whether the exact file may cross the Player content boundary; PRODUCTION_SOURCE, PRODUCTION_EVIDENCE and SUPERSEDED_CONTENT remain false, and the field does not determine Git/LFS storage or prove that a PLAYER_CONTENT file is actually included in a build."
    requiredEvidence:
      - "Repository-relative path and matching SHA-256"
      - "Named source owner and explicit PROJECT_AUTHORED status"
      - "Matching BinaryAssetInventory entry"
      - "At least one non-empty source-evidence locator or authorship record"
    failureDisposition: "Treat the file as unregistered media and block shipping eligibility until the first-party record is complete and exact."

  reviewOnlyContentRule:
    allowedRepositoryPurpose: "Design reference and decision history only"
    allowedHumanReferenceUse: "A human artist may use an approved design image as visual reference while creating a new original production asset."
    shippingAllowed: false
    prohibitedUses:
      - "Direct import, copy, or re-encoding of the original review image into a Player build"
      - "Use of the original review image as a production texture, sprite, UI image, Steam store image, or marketing image"
      - "Redistribution of the original review image in a source-art bundle"
      - "Shipping a mechanically or automatically generated derivative of the original review image"
    promotionRequirement: "Moving the original review file, a re-encoded copy, or a mechanically generated derivative into shipping scope requires a new source/rights review and an inventory revision; C2PA metadata alone is insufficient. Human reconstruction from an approved design reference remains allowed."

  evidenceRules:
    normativePathsMustBeRepositoryRelative: true
    machineSpecificAbsolutePathsAllowedInNormativeFields: false
    packageCacheHashesAllowedInNormativeFields: false
    packageCacheObservationsAllowedOnlyUnderAuditNotes: true
    emptyRequiredFieldsAllowed: false
    requiredPackageFields:
      - "packageId"
      - "resolvedVersion"
      - "source"
      - "relationship"
      - "usageClass"
      - "licenseFamily"
      - "noticeDisposition"
      - "sourceEvidence"
    requiredFirstPartyAssetFields:
      - "path"
      - "sha256"
      - "assetType"
      - "sourceOwner"
      - "sourceStatus"
      - "intendedUse"
      - "licenseFamily"
      - "rightsStatus"
      - "noticeDisposition"
      - "reviewOnly"
      - "shippingAllowed"
      - "sourceEvidence"

  releaseAudit:
    automaticBuildAllowed: false
    currentScope: "Source package, review-only reference, first-party production source/evidence, and Player-content asset inventory"
    finalTarget: "Windows x64 Player"
    finalAuditOwners: ["BLD-001", "ALP-001"]
    trigger: "After the user performs the Windows Player build"
    requiredChecks:
      - "Compare actual Player files and managed/native assemblies with this source inventory."
      - "Include all applicable Unity engine and package notices in the final release notice set."
      - "Confirm editor/test-only material is absent before excluding its notice from the release bundle."
      - "Record the user-built artifact identity and audit result without running an automatic build."

  limitations:
    - "This policy records engineering evidence and does not provide a legal opinion."
    - "ThirdPartyInventory.yaml retains its historical LIC-001 filename for compatibility; firstPartyProductionAssets is a separate, disjoint category and does not classify project-authored work as third-party content."
    - "At the LIC-001 audit snapshot, Unity 6000.3.9f1 had MacStandaloneSupport only. Windows Build Support (Mono) was installed later for BLD-001, but no Windows Player contents have been produced or audited."
    - "Unity package stripping and shader compilation can change the final redistributed component set."
    - "The installed Unity aggregate legal notice is not a per-package or per-module mapping."
